<div class="app-theme-wrapper" [ngClass]="travelService.currentTheme + '-theme'">

  <!-- Top Navigation Header -->
  <header class="top-nav">
    <div class="nav-container">
      <a routerLink="/explore" class="brand-anchor">
        <div class="brand-badge">
          <i class="fa-solid fa-compass"></i>
        </div>
        <span class="brand-label">Wanderlust</span>
      </a>

      <!-- Navigation Switcher -->
      <nav class="tab-switcher">
        <a 
          routerLink="/explore" 
          routerLinkActive="active" 
          class="tab-link">
          <i class="fa-regular fa-compass"></i>
          <span>Explore Guides</span>
        </a>
        <a 
          routerLink="/agencies" 
          routerLinkActive="active" 
          class="tab-link">
          <i class="fa-solid fa-earth-americas"></i>
          <span>Top Agencies</span>
        </a>
        <a 
          routerLink="/planner" 
          routerLinkActive="active" 
          class="tab-link">
          <i class="fa-regular fa-calendar-check"></i>
          <span>Trip Planner</span>
        </a>
      </nav>

      <!-- Right Header Tools -->
      <div class="nav-tools">
        <!-- Dark / Light Theme Mode Switcher -->
        <button 
          class="btn-theme-toggle" 
          (click)="toggleTheme()" 
          [title]="'Switch to ' + (isDark ? 'Light' : 'Dark') + ' Mode'"
          [attr.aria-label]="'Switch to ' + (isDark ? 'Light' : 'Dark') + ' Mode'">
          <i class="fa-solid" [class.fa-sun]="isDark" [class.fa-moon]="!isDark"></i>
          <span class="theme-text">{{isDark ? 'Light' : 'Dark'}}</span>
        </button>

        <a routerLink="/planner" class="btn-header-cta">
          <i class="fa-solid fa-plus"></i>
          <span>Schedule Trip</span>
        </a>
      </div>
    </div>
  </header>

  <main class="page-main">
    <router-outlet></router-outlet>
  </main>

  <footer class="site-footer">
    <div class="footer-content">
      <div class="footer-credits">
        &copy; 2026 Wanderlust. Aesthetic exploration & journey planning.
      </div>
      <div class="footer-links">
        <a href="#" class="footer-icon" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a>
        <a href="#" class="footer-icon" aria-label="X"><i class="fa-brands fa-x-twitter"></i></a>
        <a href="#" class="footer-icon" aria-label="Unsplash"><i class="fa-brands fa-unsplash"></i></a>
      </div>
    </div>
  </footer>

</div>
